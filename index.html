<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🛑V̳i̳r̳a̳l̳!̳ ▶️ V̳i̳d̳e̳o̳s📣</title>
    <style>
        /* Reset CSS dasar */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        /* --- VIDEO CLICKABLE LINK --- */
        .video-click-area {
            display: block; 
            position: relative;
            width: 100%;
            text-decoration: none;
            background-color: #000;
            cursor: pointer;
            overflow: hidden;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(254, 44, 85, 0.3);
            aspect-ratio: 16 / 9;
        }

        .video-click-area video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none; /* Agar klik tembus ke tag <a> */
        }

        .video-click-area:hover {
            transform: scale(1.01);
            transition: transform 0.3s ease;
            box-shadow: 0 0 30px rgba(254, 44, 85, 0.6);
        }

        .play-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            animation: pulse-play 2s infinite;
            backdrop-filter: blur(2px);
        }

        .play-button::after {
            content: '';
            display: block;
            width: 0;
            height: 0;
            border-left: 25px solid #fff;
            border-top: 15px solid transparent;
            border-bottom: 15px solid transparent;
            margin-left: 8px;
        }

        .footer {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #666;
            z-index: 10;
        }

        @media (max-width: 768px) {
            body { padding: 0; justify-content: flex-start; }
            .container { max-width: 100%; height: 100dvh; }
            .video-click-area { width: 100%; height: 100%; border-radius: 0; aspect-ratio: unset; }
            .footer { position: absolute; bottom: 20px; width: 100%; }
        }

        @keyframes pulse-play { 
            0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.5); } 
            70% { box-shadow: 0 0 0 20px rgba(255, 255, 255, 0); } 
            100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); } 
        }
    </style>
</head>
<body>
 
    <div class="container">
        <!-- ID 'rotatorLink' ditambahkan untuk JavaScript -->
        <a href="#" id="rotatorLink" class="video-click-area" target="_blank">
            <video autoplay loop muted playsinline poster="">
                <source src="video.mp4" type="video/mp4">
            </video>
            <div class="play-button"></div>
        </a>

        <div class="footer">
            &copy; 2025 Virallin. All rights reserved.
        </div>
    </div>

    <script type="text/javascript">
        // --- DAFTAR DIRECT LINK ANDA DISINI ---
        const links = [ 
            "https://www.profitablecpmratenetwork.com/py0sddpe83?key=0e45ea863f0532af90c5a79e6dd5d152",
            "https://wwpb.ailooe.com/redirect-zone/058f7788",
            "https://www.profitablecpmratenetwork.com/ge65qx6gs?key=28a0fcaf13c60ae90e1d94503ac2f67b"
        ];

        const rotatorElement = document.getElementById('rotatorLink');

        // Fungsi untuk mengambil link secara acak
        function getRandomLink() {
            const index = Math.floor(Math.random() * links.length);
            return links[index];
        }

        // Jalankan saat area video diklik
        rotatorElement.addEventListener('click', function(e) {
            // Pilih link baru setiap kali klik terjadi
            const chosenLink = getRandomLink();
            this.href = chosenLink;
            
            // Log ke console untuk pengecekan (bisa dihapus nanti)
            console.log("Mengarahkan ke: " + chosenLink);
        });

        // Set link awal saat halaman pertama kali dibuka
        rotatorElement.href = getRandomLink();
    </script>
